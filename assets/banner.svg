<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#100303"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative shapes, low opacity -->
  <circle cx="120" cy="80" r="70" fill="#ff2d2d" opacity="0.05"/>
  <circle cx="1080" cy="300" r="90" fill="#ff2d2d" opacity="0.05"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#ff4d4d" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#ff4d4d" stroke-width="1" opacity="0.08"/>
  <polygon points="60,340 140,340 100,280" fill="#ff2d2d" opacity="0.06"/>
  <polygon points="1060,40 1140,40 1100,-20" fill="#ff2d2d" opacity="0.06"/>
  <path d="M0,180 Q300,140 600,180 T1200,180" stroke="#ff4d4d" stroke-width="1" fill="none" opacity="0.06"/>

  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Violence District Script</tspan>
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Lightweight script engine for Violence District modders — single binary,</tspan>
    <tspan x="600" dy="30">no runtime setup needed.</tspan>
  </text>
</svg>